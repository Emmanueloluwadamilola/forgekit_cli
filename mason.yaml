# Registers the Forge bricks for local use.
# Run `mason get` in this directory, then `mason make <brick>`.
bricks:
  forge_app:
    path: bricks/forge_app
  forge_app_mvvm:
    path: bricks/forge_app_mvvm
  forge_app_modular:
    path: bricks/forge_app_modular
  forge_feature:
    path: bricks/forge_feature
  forge_feature_mvvm:
    path: bricks/forge_feature_mvvm
  forge_feature_modular:
    path: bricks/forge_feature_modular
  forge_widget:
    path: bricks/forge_widget
  forge_service:
    path: bricks/forge_service
