name: "{{name.snakeCase()}}"
description: A new Forge Flutter application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  # {{#useProvider}}
  provider: ^6.1.2
  # {{/useProvider}}
  # {{#useRiverpod}}
  flutter_riverpod: ^2.6.1
  # {{/useRiverpod}}
  # Bloc and Cubit use the same flutter_bloc package.
  # {{^useProvider}}
  # {{^useRiverpod}}
  flutter_bloc: ^9.1.0
  # {{/useRiverpod}}
  # {{/useProvider}}
  # {{^useRouter}}

  # Routing
  go_router: ^14.0.0
  # {{/useRouter}}

  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Networking
  dio: ^5.8.0
  retrofit: ^4.9.2
  awesome_dio_interceptor: ^1.3.0

  # Serialization
  json_annotation: ^4.12.0

  # Storage
  flutter_secure_storage: ^9.2.2

  # UI helpers
  gap: ^3.0.1
  flutter_svg: ^2.0.10+1

  # Optional functional error handling
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.13
  injectable_generator: ^2.6.1
  retrofit_generator: ^10.2.6
  json_serializable: ^6.14.0

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/
