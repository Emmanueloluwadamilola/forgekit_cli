name: forge_app
description: >-
  Bootstraps a new Forge Flutter project skeleton (lib/core scaffolding,
  main.dart and a pubspec.yaml with the locked dependency versions) conforming
  to the Forge Flutter Architecture Standard.
version: 0.1.0+1

environment:
  mason: ">=0.1.0 <1.0.0"

vars:
  name:
    type: string
    description: The project / package name (snake_case).
    prompt: What is the project name?
  org:
    type: string
    description: The organization identifier (reverse-domain).
    default: com.forgecyberlabs
    prompt: What is the organization identifier?
  useRouter:
    type: boolean
    description: >-
      Routing style. true = named routes. false = go_router.
    default: true
    prompt: Use named routes? (No = generate a go_router app router instead)
  useProvider:
    type: boolean
    description: Generate Provider-based ChangeNotifier state management.
    default: true
    prompt: Use Provider state management?
  useRiverpod:
    type: boolean
    description: Generate Riverpod state management.
    default: false
    prompt: Use Riverpod state management?
  useBloc:
    type: boolean
    description: Generate Bloc state management.
    default: false
    prompt: Use Bloc state management?
  useCubit:
    type: boolean
    description: Generate Cubit state management.
    default: false
    prompt: Use Cubit state management?
