name: forge_feature
description: >-
  Generates a full Clean-Architecture feature tree (data / domain /
  presentation / di) conforming to §3 of the Forge Flutter Architecture
  Standard.
version: 0.1.0+1

environment:
  mason: ">=0.1.0 <1.0.0"

vars:
  name:
    type: string
    description: The feature name (e.g. orders). snake_case folder, PascalCase classes.
    prompt: What is the feature name?
  projectName:
    type: string
    description: The Dart package name used in `package:<projectName>/...` imports.
    default: app
    prompt: What is the Dart package name?
  useRouter:
    type: boolean
    description: >-
      Routing style. true = named routes (registers via Screen.id in the app
      routes map). false = go_router (emits <feature>_routes.dart with GoRoute
      entries to spread into a central AppRouter).
    default: true
    prompt: Use named routes? (No = generate a go_router routes file instead)
  runBuildRunner:
    type: boolean
    description: Run build_runner automatically after generation.
    default: false
    prompt: Run build_runner now?
