name: forgekit
description: >-
  Flutter ForgeKit CLI wraps Mason to scaffold Flutter code following a
  configurable architecture standard.
version: 0.1.0
publish_to: none
repository: https://github.com/Emmanueloluwadamilola/forgekit_cli
homepage: https://github.com/Emmanueloluwadamilola/forgekit_cli
issue_tracker: https://github.com/Emmanueloluwadamilola/forgekit_cli/issues

environment:
  # Deliberately lower than the >=3.8.0 the generated app bricks require. The
  # mismatch is enforced at runtime instead, by
  # `checkGeneratedProjectSdkSupport` in lib/src/utils.dart, which refuses to
  # generate on a toolchain that could not build the result.
  #
  # Raising this to 3.8.0 also moves the package's language version past 3.7,
  # which switches `dart format` to the tall style and would require reformatting
  # the entire tree plus every Mason template in one commit. That reformat is
  # worth doing, but as its own change — not bundled into a behaviour fix.
  sdk: ">=3.5.4 <4.0.0"

executables:
  forgekit: forgekit

dependencies:
  args: ^2.5.0
  crypto: ^3.0.3
  http: ^1.2.0
  mason: ^0.1.1
  mason_logger: ^0.3.0
  path: ^1.9.0
  pub_semver: ^2.2.0
  yaml: ^3.1.2
  yaml_edit: ^2.2.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.8
